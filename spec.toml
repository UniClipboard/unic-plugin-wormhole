manifest_version = 1
id = "unic.wormhole"
version = "0.1.1"
icon = "lock"
api_version = 1
kind = "go"
module = "github.com/UniClipboard/unic-plugin-wormhole"
package = "./cmd/unic-plugin-wormhole"
capabilities = ["action"]
name = "Wormhole Temporary Share"
summary = "Create an encrypted temporary download link."

[i18n.zh-CN]
name = "Wormhole 临时分享"
summary = "生成端到端加密的临时下载链接。"

[[actions]]
id = "share"
title = "通过 Wormhole 临时分享"
accepts = ["text", "image", "files"]
placements = ["history.item_menu", "history.toolbar", "quick_panel"]
post_actions = ["copy", "present"]
timeout_ms = 300000

