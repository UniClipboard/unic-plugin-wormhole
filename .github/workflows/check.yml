name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  process-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: sh scripts/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: process-e2e-receipt
          path: .cache/acceptance/
          retention-days: 7
